name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive # Garante que baixa os submódulos (como o rexglue-sdk)

    - name: Set up Android NDK
      uses: nsamuel/setup-android-ndk@v1
      with:
        ndk-version: r25c # Use a versão do NDK requerida pelo projeto

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.22.1'

    - name: Build Native C++ (.so)
      run: |
        # Executa o script de build para criar os binários C++ do Android
        # O tutorial especifica 'arm64' ou a build completa (evitando paralelismo alto)
        ./build-android.sh arm64 apk

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./android

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gh3-android-debug
        path: android/app/build/outputs/apk/debug/*.apk
        
